# Decision rules
decision:
  graduation: "2025-06"            # my graduation date, YYYY-MM
  max_years_required: 2            # 3+ years required = drop
  maybe_if_years_preferred: 3      # 3+ years preferred = #maybe
  apply_now_score: 0.5             # 50%+ of required hard skills = #apply-now
  maybe_score: 0.25                # 25-50% = #maybe; any below = digest
  drop_domains: [mobile]
  always_maybe_titles: [forward deployed]

early_career: [new grad, new graduate, early career, university, entry level,
  entry-level, junior, graduate]

level_ii_entry_companies: [google]

# Companies never alerted on (aggregators that repost other companies' jobs, etc.)
company_exclude: [jobgether]

